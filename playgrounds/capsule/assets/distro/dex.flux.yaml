---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dex
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.dexidp.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: flux-system
spec:
  interval: 10m
  serviceAccountName: kustomize-controller
  targetNamespace: dex
  chart:
    spec:
      chart: dex
      version: "0.24.1"
      sourceRef:
        kind: HelmRepository
        name: dex
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: -1
  values:
    replicaCount: 1
    service:
      type: NodePort
      ports:
        http:
          port: 5556
          targetPort: 5556
          nodePort: 32556
    ingress:
      enabled: false
    config:
      # Replace NODE_IP_OR_DNS with an address reachable from:
      # - your workstation/browser
      # - the kube-apiserver host/node
      issuer: "${DEX_URL}"
      storage:
        type: kubernetes
        config:
          inCluster: true

      web:
        http: 0.0.0.0:5556

      oauth2:
        skipApprovalScreen: true

      enablePasswordDB: true

      staticClients:
        - id: kubernetes
          name: Kubernetes
          secret: kubernetes-secret
          redirectURIs:
            - "$PROXY_URL/*"
            - "$HEADLAMP_URL/oidc-callback"
        - id: gangplank
          name: Gangplank
          secret: gangplank-secret
          redirectURIs:
            - "${GANGPLANK_URL}/callback"
      staticPasswords:
        - email: bob@projectcapsule.dev
          username: bob
          userID: 11111111-1111-1111-1111-111111111111
          hash: '$2y$10$i34m83YDT//1FM/Kgh5ij.4oldpb6BTR9yrMKccEbb8ROZ/B9/ws.'
          groups:
            - capsule-users
  
        - email: alice@projectcapsule.dev
          username: alice
          userID: 22222222-2222-2222-2222-222222222222
          hash: '$2y$10$RDFCIouEd/mKeIPnPMxBOOiee7o1lk.dwI9znS81M2Csc.rF4axq6'
          groups:
            - capsule-users
  
        - email: gatsby@projectcapsule.dev
          username: gatsby
          userID: 33333333-3333-3333-3333-333333333333
          hash: '$2y$10$ry8ZzAFd.vzKP4OKpcmPzONzLrixMDZfo0HZwqKRUouB8HcOdH0RW'
          groups:
            - capsule-users
  
        - email: admin@example.com
          username: admin
          userID: 44444444-4444-4444-4444-444444444444
          hash: '$2y$10$0LNxDaCWcsxf6kG66x04WOSQbOW17Pqpm29NIJY9YrcQpvimwgsQm'
