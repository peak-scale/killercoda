---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: capsule
  namespace: flux-system
spec:
  type: oci
  interval: 5m0s
  url: oci://ghcr.io/projectcapsule/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capsule
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 15s
  targetNamespace: capsule-system
  releaseName: capsule
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: capsule
      sourceRef:
        kind: HelmRepository
        name: capsule
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    remediation:
      remediateLastFailure: true
  driftDetection:
    mode: disabled
  values:
    proxy:
      enabled: true
      gangplank:
        enabled: true
        config:
          clusterName: "tenant-cluster"
          apiServerURL: "${PROXY_URL}"
          scopes:
            - "openid"
            - "profile"
            - "email"
            - "groups"
            - "offline_access"
          redirectURL: "${GANGPLANK_URL}/callback"
          usernameClaim: "email"
          clientID: "gangplank"
          clientSecret: "gangplank-secret"
          authorizeURL: "${DEX_URL}/auth"
          tokenURL: "${DEX_URL}/token"
      certManager:
        generateCertificates: true
        certificate:
          ipAddresses:
            - 127.0.0.1
          dnsNames:
            - localhost
      service:
        type: NodePort
        nodePort: 30443
      options:
        generateCertificates: false
        extraArgs:
          - "--feature-gates=ProxyClusterScoped=true"
    crds:
      install: true
    tls:
      enableController: false
      create: false
    manager:
      options:
        allowServiceAccountPromotion: true
        administrators:
          - kind: "Group"
            name: "capsule-admins"
        users:
          - kind: "Group"
            name: "capsule-users"
        forceTenantPrefix: false