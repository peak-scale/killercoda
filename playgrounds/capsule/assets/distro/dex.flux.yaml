---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dex
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.dexidp.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: flux-system
spec:
  interval: 10m
  serviceAccountName: kustomize-controller
  targetNamespace: dex
  chart:
    spec:
      chart: dex
      version: "0.24.1"
      sourceRef:
        kind: HelmRepository
        name: dex
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: -1
  values:
    replicaCount: 1
    service:
      type: NodePort
      ports:
        http:
          port: 5556
          targetPort: 5556
          nodePort: 32556
    ingress:
      enabled: false
    config:
      # Replace NODE_IP_OR_DNS with an address reachable from:
      # - your workstation/browser
      # - the kube-apiserver host/node
      issuer: "${DEX_URL}"
      storage:
        type: kubernetes
        config:
          inCluster: true

      web:
        http: 0.0.0.0:5556

      oauth2:
        skipApprovalScreen: true

      enablePasswordDB: true

      staticClients:
        - id: kubernetes
          name: Kubernetes
          secret: kubernetes-secret
          redirectURIs:
            - "$GANGPLANK_URL/*"
            - "$PROXY_URL/*"
            - "$HEADLAMP_URL/*"
      staticPasswords:
    staticPasswords:
      - email: bob@example.com
        username: bob
        userID: 11111111-1111-1111-1111-111111111111
        hash: '$$2y$10$k1UZQdQXDL.Q7VoXS2dVBu0k5aTHlZRV0vUpn1b5V9dUfSH/YyoO6'
        groups:
          - users

      - email: alice@example.com
        username: alice
        userID: 22222222-2222-2222-2222-222222222222
        hash: '$$2y$10$WVzg/JwXCDy/4KiBTXFGBuA8Vdoho4nJiZxvZU6XeJZnmC4Bpgo7K'
        groups:
          - users

      - email: gatsby@example.com
        username: gatsby
        userID: 33333333-3333-3333-3333-333333333333
        hash: '$$2y$10$/x3n3fjWrx6L3NTiQBLCKOy.RYWq3fbJ.LBitN3Ehs.l4t/eP8lMa'
        groups:
          - users

      - email: admin@example.com
        username: admin
        userID: 44444444-4444-4444-4444-444444444444
        hash: '$$2y$10$T95qBAKFlyqmaRVGMsJbB.CmCslq518MOWu2MhcMoasPJvgbDMkLG'
        groups:
          - users
          - cluster-admins